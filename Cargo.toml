[package]
name = "mkbib"
version = "0.8.0"
edition = "2021"
license = "MIT"  # Or "GPL-3.0", "Apache-2.0", etc.
description = "A modern BibTeX editor for GTK4"

[dependencies]
# GUI
gtk4 = { version = "0.11", features = ["v4_10"] }
relm4 = { version = "0.11", features = ["libadwaita", "macros"] }
relm4-components = "0.11"
libadwaita = { version = "0.9", features = ["v1_5"] }

# Network & Async
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "5.0"

strsim = "0.10"
csv = "1.3"
# BibTeX Handling (Better for editing than Hayagriva)
biblatex = "0.8"
anyhow = "1.0"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Mavens Group"
copyright = "2026, Mavens Group"
depends = "$auto"
section = "utils"
priority = "optional"
extended-description = """\
MkBib is a bibliography manager engineered for performance and correctness, \
built with Rust and GTK4. It manages BibLaTeX databases with strict field \
validation and atomic saves, designed for large reference datasets."""
assets = [
    ["target/release/mkbib", "usr/bin/", "755"],
    ["assets/org.mavensgroup.mkbib.desktop", "usr/share/applications/", "644"],
    ["assets/org.mavensgroup.mkbib.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/mkbib/README", "644"],
]

[package.metadata.generate-rpm]
summary = "A modern BibTeX editor for GTK4"
license = "MIT"
assets = [
    { source = "target/release/mkbib", dest = "/usr/bin/mkbib", mode = "755" },
    { source = "assets/org.mavensgroup.mkbib.desktop", dest = "/usr/share/applications/org.mavensgroup.mkbib.desktop", mode = "644" },
    { source = "assets/org.mavensgroup.mkbib.svg", dest = "/usr/share/icons/hicolor/scalable/apps/org.mavensgroup.mkbib.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/mkbib/README", mode = "644", doc = true },
]
auto-req = "yes"
